name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# This repository is a FORK of Go's image/jpeg, so it does not carry the
# org's 100% statement-coverage gate: most of the code and all but one of
# the test files are Go's, and Go does not write its tests to that rule.
# What is enforced instead is that Go's own suite passes unaltered and that
# the one thing this fork changes has tests of its own -- see NOTICE.
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  # The fork's own reason to exist, named so a failure says which it was.
  chroma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: the chroma upsampler
        run: go test -run 'Upsampl|Unsubsampled|Ratio|DrawYCbCr' -v ./

  # Cross-compiling proves the code COMPILES for an architecture; it does not
  # prove it computes the right answer there. A JPEG is a byte stream whose
  # markers carry multi-byte lengths and whose coefficients are reassembled from
  # bits.
  #
  # s390x is BIG-ENDIAN and 386/arm are 32-bit, so between them these lanes
  # cover both assumptions a byte-stream reader can carry without knowing it.
  # poppler and pdfium test on none of the four 64-bit arches; 32-bit ARM they
  # do hold, and we did not.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (${{ matrix.via }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, exec: "-exec=qemu-riscv64-static", via: qemu }
          - { goarch: loong64, exec: "-exec=qemu-loongarch64-static", via: qemu }
          - { goarch: ppc64le, exec: "-exec=qemu-ppc64le-static", via: qemu }
          - { goarch: s390x,   exec: "-exec=qemu-s390x-static", via: qemu }
          # 386 runs with NO emulator: a 386 ELF executes directly on the
          # x86-64 runner. That is not a convenience, it is a correctness
          # requirement. Measured on one commit of go-gfx/gfx, eight identical
          # lanes each:
          #
          #   under qemu-i386                    5 failures out of 8
          #   under qemu-i386, asyncpreemptoff=1 0 out of 8
          #   native on the same runner          0 out of 8
          #   under qemu-arm                     0 out of 8
          #
          # Each failure landed on a DIFFERENT input although the seed is
          # fixed, and the wrong value was a sign flip rather than a rounding
          # difference. qemu-i386 loses the guest's floating-point state across
          # the signal Go delivers for asynchronous preemption. Emulating 386
          # here would buy nothing and cost a lane that goes red at random.
          - { goarch: "386",   exec: "", via: native }
          - { goarch: arm,     exec: "-exec=qemu-arm-static", via: qemu }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test under qemu (${{ matrix.goarch }})
        run: |
          flag="${{ matrix.exec }}"
          ex=""
          if [ -n "$flag" ]; then
            base="${flag#-exec=}"
            q=""
            for cand in "$base" "${base%-static}"; do
              command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
            done
            # ⛔ A missing emulator FAILS this lane. A lane that reports success
            # for an architecture it never ran is the one outcome this matrix
            # exists to rule out.
            if [ -z "$q" ]; then
              echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
              exit 1
            fi
            ex="-exec=$q"
            # Printed on purpose: without it, "ran under emulation" and
            # "skipped" are indistinguishable from a green tick.
            echo "running ${{ matrix.goarch }} under $q"
          else
            # ⚠ An EMPTY exec is a lane that runs NATIVELY on purpose: a 386
            # ELF executes directly on the x86-64 runner, and qemu-i386 was
            # measured to lose the guest's floating-point state across the
            # signal Go delivers for preemption. Failing it for having no
            # emulator would break a lane that is correct as it stands.
            echo "running ${{ matrix.goarch }} natively"
          fi
          GOARCH=${{ matrix.goarch }} go test $ex ./...
